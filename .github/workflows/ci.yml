name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate catalog
        run: python3 development/scripts/check_catalog.py
      - name: Run tests
        run: python3 -m unittest discover -s development/tests -v
